# ==============================================================================
# TaskFlow Application Configuration
# ==============================================================================
# Sensitive values (database URIs, credentials, secrets) must be supplied via
# environment variables or a local gitignored .env file—never hardcode them here.

# Import optional local .env file (OS environment variables take precedence)
spring.config.import=optional:file:.env[.properties]

# Application
spring.application.name=taskflow

# Web Server (Render assigns PORT; SERVER_PORT supports local overrides)
server.port=${PORT:${SERVER_PORT:8080}}
server.shutdown=graceful

# MongoDB Atlas (Spring Boot 4.x uses spring.mongodb.*)
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:taskflow}
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX_CREATION:true}

# Safe Database Connectivity Verification
taskflow.mongodb.verify-on-startup=${MONGODB_VERIFY_ON_STARTUP:true}

# JWT Authentication (supply JWT_SECRET via environment variable or local .env; never hardcode)
taskflow.security.jwt.secret=${JWT_SECRET}
taskflow.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS Allowed Origins (comma-separated; defaults to local dev origins)
taskflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Actuator & Cloud Health Probes
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-components=${ACTUATOR_HEALTH_SHOW_COMPONENTS:always}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_SHOW_DETAILS:never}
management.endpoint.health.probes.enabled=true

# Logging (suppress MongoClientSettings INFO log so database username is not logged)
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.taskflow=${LOG_LEVEL_APP:INFO}
logging.level.org.mongodb.driver.client=${LOG_LEVEL_MONGO_CLIENT:WARN}
